/* ── live waveform ── */
function Waveform({hist,color,h=70}){
  if(hist.length<2)return null;
  const W=400;
  const min=Math.min(...hist), max=Math.max(...hist);
  const range=max-min||1;
  const pts=hist.map((v,i)=>({x:(i/(hist.length-1))*W,y:h-((v-min)/range)*h}));
  const path=pts.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
  const area=`M0,${h} ${pts.map(p=>`L${p.x},${p.y}`).join(' ')} L${W},${h}Z`;
  const gid='wf'+color.replace('#','');
  return(
    <svg width="100%" height={h} viewBox={`0 0 ${W} ${h}`} preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity=".25"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      <path d={area} fill={`url(#${gid})`}/>
      <path d={path} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

/* ── accel bars ── */
function AccelBars({hist}){
  const W=300,H=60;
  const bW=W/hist.length;
  return(
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`}>
      {hist.map((v,i)=>{
        const h=(v/3.5)*H;
        const c=v>2?BLUE:v>1?'rgba(39,116,174,.55)':'rgba(39,116,174,.2)';
        return <rect key={i} x={i*bW+.5} y={H-h} width={bW-1} height={h} fill={c} rx="1"/>;
      })}
    </svg>
  );
}

/* simple flow diagram */
function CorrelationFlow(){
  const sensors=[
    {l:'PPG',c:RED,x:60,y:40},{l:'SpO₂',c:BLUE,x:60,y:110},
    {l:'TEMP',c:'#a78bfa',x:60,y:180},{l:'ACCEL',c:GOLD,x:60,y:250},
    {l:'GYRO',c:GREEN,x:60,y:320},{l:'ECG',c:'#f472b6',x:60,y:390},
  ];
  const mid=[
    {l:'Recovery Score',c:AMBER,x:260,y:100},
    {l:'Match Readiness',c:BLUE,x:260,y:220},
    {l:'Serve Score',c:GREEN,x:260,y:320},
  ];
  const out={l:'Performance Story',c:GOLD,x:460,y:220};
  const edges_sm=[
    [0,0],[1,0],[2,0],[3,1],[0,1],[2,1],[3,2],[4,2],[0,2],
  ];
  const edges_mo=[
    [0,0],[1,0],[2,0],
  ];
  const W=580,H=440;
  return(
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`}>
      {/* sensor→mid edges */}
      {edges_sm.map(([si,mi],i)=>(
        <line key={'sm'+i} x1={sensors[si].x+40} y1={sensors[si].y+12} x2={mid[mi].x} y2={mid[mi].y+12}
          stroke="rgba(255,255,255,.08)" strokeWidth="1.5" className="flow-line"/>
      ))}
      {/* mid→out edges */}
      {mid.map((m,i)=>(
        <line key={'mo'+i} x1={m.x+100} y1={m.y+12} x2={out.x} y2={out.y+12}
          stroke="rgba(255,209,0,.2)" strokeWidth="1.5" className="flow-line"/>
      ))}

      {/* sensor nodes */}
      {sensors.map((s,i)=>(
        <g key={i}>
          <rect x={s.x} y={s.y} width="80" height="24" rx="6" fill={s.c+'22'} stroke={s.c+'66'} strokeWidth="1"/>
          <text x={s.x+40} y={s.y+16} textAnchor="middle" fill={s.c} fontSize="10" fontWeight="700" fontFamily={FD}>{s.l}</text>
        </g>
      ))}
      {/* mid nodes */}
      {mid.map((m,i)=>(
        <g key={i}>
          <rect x={m.x} y={m.y} width="100" height="24" rx="6" fill={m.c+'1a'} stroke={m.c+'66'} strokeWidth="1"/>
          <text x={m.x+50} y={m.y+16} textAnchor="middle" fill={m.c} fontSize="9" fontWeight="700" fontFamily={FD}>{m.l}</text>
        </g>
      ))}
      {/* output */}
      <rect x={out.x} y={out.y} width="110" height="24" rx="6" fill={out.c+'22'} stroke={out.c+'88'} strokeWidth="1.5"/>
      <text x={out.x+55} y={out.y+16} textAnchor="middle" fill={out.c} fontSize="10" fontWeight="800" fontFamily={FD}>{out.l}</text>
    </svg>
  );
}

                        textTransform:'uppercase',marginBottom:5}}>Crusade Insight</div>
                      <div style={{fontSize:12,color:'#d1d5db',lineHeight:1.65}}>{z.crusade}</div>
                    </div>
                  </div>
                  {/* athlete vs coach framing */}
                  {stealth ? (
                    <div style={{marginTop:10,background:'rgba(34,197,94,.06)',border:'1px solid rgba(34,197,94,.18)',
                      borderRadius:8,padding:'9px 12px',fontSize:12,color:'#d1d5db',lineHeight:1.6}}>
                      <span style={{color:GREEN,fontWeight:700,fontFamily:FD,fontSize:10,letterSpacing:1,
                        textTransform:'uppercase',marginRight:8}}>For You →</span>
                      {z.z===1&&'Use changeovers to get here. Breathe through your nose. Control your pace.'}
                      {z.z===2&&'Your aerobic engine is what keeps you sharp in a third set. Every Z2 minute in practice is an investment in that.'}
                      {z.z===3&&'Grey zone. When you\'re here in a match, it\'s because you\'re working hard — that\'s fine. In practice, aim for Z2 or Z4, not in between.'}
                      {z.z===4&&'This is where your serve lives. When you hit 124 mph, your heart is here. The fitter you are at this zone, the more you can sustain it.'}
                      {z.z===5&&'Max zone. Brief but powerful. Your explosive split step and first serve live here. Trust your training — your body knows what to do.'}
                    </div>
                  ) : (
                    <div style={{marginTop:10,background:'rgba(39,116,174,.06)',border:'1px solid rgba(39,116,174,.18)',
                      borderRadius:8,padding:'9px 12px',fontSize:12,color:'#d1d5db',lineHeight:1.6}}>
                      <span style={{color:BLUE,fontWeight:700,fontFamily:FD,fontSize:10,letterSpacing:1,
                        textTransform:'uppercase',marginRight:8}}>Coach Note →</span>
                      {z.z===1&&`${z.min} min in Z1 today — appropriate. Target: changeover HR should return to Z1 within 15s. Currently averaging 18s. One improvement area.`}
                      {z.z===2&&`${z.min} min (${Math.round(z.min/totalMin*100)}%) in Z2 — below the 50–60% target from the article. Match week taper explains this. Rebuild Z2 base next week post-USC.`}
                      {z.z===3&&`${z.min} min in the grey zone — correctly low for match week. Article Insight: chronic Z3 accumulation builds fatigue without Z2 adaptation. Taper is working.`}
                      {z.z===4&&`${z.min} min at lactate threshold — the serve and high-intensity point zone. HR data shows Marcus spends quality time here, consistent with the serve velocity improvement.`}
                      {z.z===5&&`${z.min} min at max effort — includes the 178 bpm spike on the wide serve. VO₂ max stimulus is appropriately brief. Neuromuscular loading confirmed by ACCEL at 2.8g.`}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

              <div style={{fontSize:15,fontWeight:700,color:'#e8e8f0',fontFamily:FD}}>{x.v}</div>
            </div>
          ))}
        </div>
      </div>
      </div>

      {/* Training Zones — full width, after HR + Accel */}
      <TrainingZones liveHR={liveHR} stealth={stealth} phaseLabel={phaseLabel}/>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div className="card" style={{padding:20}}>
        <Label>Sensor Fusion — Current Session</Label>
        {[
          {l:'PPG → HRV',        v:'68 ms',    note:'9% below baseline',       c:RED,    feed:'Nervous system under mild stress — adaptive, not alarming'},
          {l:'SpO₂',            v:'98%',      note:'Optimal saturation',       c:BLUE,   feed:'Aerobic capacity fully available for match intensity'},
          {l:'TEMP → Shoulder', v:'+2.2 °F',  note:'Above lower body',         c:'#a78bfa',feed:'Active repair signal — appropriate post-load inflammation'},
          {l:'ACCEL → Strain',  v:'71 AU',    note:'Match-week target range',  c:GOLD,   feed:'Training load correctly tapered — priming without depleting'},
          {l:'GYRO → Lag',      v:'+12%',     note:'Best of season',           c:GREEN,  feed:'Serve mechanics at peak — gyroscope confirms the cue worked'},
        ].map((x,i)=>(
          <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
            padding:'9px 12px',background:'rgba(0,0,0,.2)',borderRadius:7,marginBottom:i<4?8:0}}>

/* ══════════════════════════════════════════════
   APP
══════════════════════════════════════════════ */
/* Session phase cycle: simulates a real tennis training session moving through zones */
const SESSION_PHASES = [
  {label:'Between Points',    target:108, spread:8,  accelBase:0.4, duration:4000},  // Z1
  {label:'Baseline Rally',    target:132, spread:10, accelBase:0.9, duration:5000},  // Z2
  {label:'High-Tempo Rally',  target:152, spread:8,  accelBase:1.4, duration:4000},  // Z3
  {label:'Serve Game',        target:168, spread:10, accelBase:2.0, duration:5000},  // Z4
  {label:'Explosive Point',   target:183, spread:8,  accelBase:2.6, duration:2500},  // Z5
  {label:'Changeover',        target:112, spread:6,  accelBase:0.3, duration:6000},  // Z1 recovery
  {label:'Groundstroke Set',  target:138, spread:8,  accelBase:1.1, duration:5000},  // Z2-3
  {label:'Serve Practice',    target:162, spread:12, accelBase:1.8, duration:4000},  // Z4
  {label:'Recovery Walk',     target:104, spread:5,  accelBase:0.2, duration:5000},  // Z1
];

function App(){
  const [stealth,setStealth]=useState(false);
  const [tab,setTab]=useState('sensors');
  const [liveHR,setLiveHR]=useState(108);
  const [hrHist,setHrHist]=useState(()=>Array(50).fill(0).map((_,i)=>108+Math.sin(i*.4)*6));
  const [accelHist,setAccelHist]=useState(()=>Array(50).fill(0).map(()=>Math.random()*.5));
  const [phaseIdx,setPhaseIdx]=useState(0);
  const [phaseLabel,setPhaseLabel]=useState('Between Points');
  const phaseRef=useRef({idx:0,elapsed:0,last:Date.now()});

  useEffect(()=>{
    const t=setInterval(()=>{
      const now=Date.now();
      const ref=phaseRef.current;
      ref.elapsed+=now-ref.last;
      ref.last=now;
      const phase=SESSION_PHASES[ref.idx];
      if(ref.elapsed>=phase.duration){
        ref.elapsed=0;
        ref.idx=(ref.idx+1)%SESSION_PHASES.length;
        setPhaseIdx(ref.idx);
        setPhaseLabel(SESSION_PHASES[ref.idx].label);
      }
      const p=SESSION_PHASES[ref.idx];
      setLiveHR(prev=>{
        const diff=p.target-prev;
        const step=diff*0.12+(Math.random()-.5)*p.spread;
        const next=Math.max(95,Math.min(196,prev+step));
        setHrHist(h=>[...h.slice(1),next]);
        return next;
      });
    },600);
    return()=>clearInterval(t);
  },[]);

  useEffect(()=>{
    const t=setInterval(()=>{
      const p=SESSION_PHASES[phaseRef.current.idx];
      const spike=Math.random()>.82?p.accelBase+Math.random()*1.2:p.accelBase*Math.random();
      setAccelHist(h=>[...h.slice(1),spike]);
    },600);
    return()=>clearInterval(t);
  },[]);

  const tabs=[
    {id:'sensors',    label:'Sensors & Metrics'},
    {id:'correlations',label:'Correlation Engine'},
    {id:'story',      label:'Performance Story'},
    {id:'live',       label:'Live Feed',live:true},
  ];

  return(
    <div style={{minHeight:'100vh',background:'#08080f',color:'#e8e8f0',fontFamily:"'Barlow',sans-serif"}}>

      {/* HEADER */}
      <div style={{background:'rgba(8,8,15,.97)',borderBottom:'1px solid rgba(39,116,174,.15)',
        padding:'12px 28px',display:'flex',alignItems:'center',justifyContent:'space-between',
        position:'sticky',top:0,zIndex:50,backdropFilter:'blur(16px)'}}>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <a href="index.html" style={{display:'flex',alignItems:'center',gap:6,color:'#9ca3af',
            textDecoration:'none',fontSize:11,fontFamily:FD,letterSpacing:1,fontWeight:600}}
            onMouseOver={e=>e.currentTarget.style.color='#e8e8f0'}
            onMouseOut={e=>e.currentTarget.style.color='#9ca3af'}>
            <Ic.Back/> Site
          </a>
          <div style={{width:1,height:28,background:'rgba(255,255,255,.1)'}}/>
          <div>
            <div style={{fontFamily:FD,fontWeight:900,fontSize:16,letterSpacing:3,color:COPPER,textTransform:'uppercase'}}>CRUSADE</div>
            <div style={{fontSize:8,letterSpacing:3,color:'#4b5563',textTransform:'uppercase',fontFamily:FD}}>Performance Intelligence</div>
          </div>
          <div style={{width:1,height:28,background:'rgba(255,255,255,.1)'}}/>
          <div>
            <div style={{fontFamily:FD,fontWeight:800,fontSize:18,color:'#e8e8f0',letterSpacing:.5}}>Marcus Chen</div>
            <div style={{fontSize:11,color:'#6b7280'}}>UCLA Men's Tennis · #2 Singles · Sophomore</div>
          </div>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:8,color:'#6b7280',letterSpacing:1.5,textTransform:'uppercase',fontFamily:FD}}>Next Match</div>
            <div style={{fontSize:12,fontWeight:700,color:GOLD,fontFamily:FD,letterSpacing:1}}>SAT vs USC · 2 DAYS</div>
          </div>
          <div onClick={()=>setStealth(s=>!s)}
            style={{display:'flex',alignItems:'center',gap:8,padding:'7px 14px',borderRadius:8,
              cursor:'pointer',userSelect:'none',transition:'all .3s',
              background:stealth?'rgba(34,197,94,.1)':'rgba(39,116,174,.1)',
              border:`1px solid ${stealth?'rgba(34,197,94,.28)':'rgba(39,116,174,.28)'}`}}>
            {stealth?<Ic.EyeOff/>:<Ic.Eye/>}
            <div>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:1,color:stealth?GREEN:BLUE,fontFamily:FD}}>
                {stealth?'ATHLETE VIEW':'COACH VIEW'}
              </div>
              <div style={{fontSize:8,color:'#6b7280'}}>{stealth?'Confidence framing active':'Full sensor data active'}</div>
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1360,margin:'0 auto',padding:'20px 28px'}}>

        {/* sensor status bar */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:8,marginBottom:18}}>
          {SENSORS.map(s=>(
            <div key={s.id} style={{background:'rgba(0,0,0,.4)',border:`1px solid ${s.color}30`,
              borderRadius:8,padding:'9px 12px',textAlign:'center'}}>
              <div style={{fontSize:16,color:s.color,marginBottom:3}}>{s.icon}</div>
              <div style={{fontSize:9,color:s.color,fontFamily:FD,fontWeight:700,letterSpacing:1.5,textTransform:'uppercase',marginBottom:2}}>{s.abbr}</div>
              <div style={{fontSize:10,color:'#9ca3af'}}>{s.id==='ppg'?`${Math.round(liveHR)} bpm`:s.reading}</div>
              {s.liveKey&&<div style={{marginTop:4,display:'flex',justifyContent:'center'}}>
                <span style={{fontSize:8,color:s.color,fontFamily:FD,letterSpacing:1}}>● LIVE</span>
              </div>}
            </div>
          ))}
        </div>

        {/* tabs */}
        <div style={{display:'flex',gap:2,borderBottom:'1px solid rgba(255,255,255,.07)',marginBottom:18}}>
          {tabs.map(t=>(
            <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`}
              onClick={()=>setTab(t.id)}
              style={{display:'flex',alignItems:'center',gap:7}}>
              {t.live&&<Ic.Dot c={RED}/>}{t.label}
            </button>
          ))}
        </div>

        {tab==='sensors'     &&<SensorsTab stealth={stealth} liveHR={liveHR} hrHist={hrHist} accelHist={accelHist}/>}
        {tab==='correlations'&&<CorrelationsTab stealth={stealth}/>}
        {tab==='story'       &&<StoryTab stealth={stealth}/>}
        {tab==='live'        &&<LiveTab liveHR={liveHR} hrHist={hrHist} accelHist={accelHist} stealth={stealth} phaseLabel={phaseLabel}/>}

        <div style={{textAlign:'center',padding:'18px 0 4px',fontSize:9,color:'#374151',
          letterSpacing:2,fontFamily:FD}}>
          CRUSADE SPORTS MEDICINE · UCLA NONPROFIT · PERFORMANCE INTELLIGENCE · PROTOTYPE DEMO
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
